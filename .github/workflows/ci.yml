name: ci

# Typecheck, lint and test the tooling, validate every definition against its
# version on the base branch, and sign and snapshot them with a throwaway key.
# Runs on GitHub-hosted runners: the repo is public, and self-hosted runners
# never serve public repos.
# CI never holds the publisher key and never publishes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # validate compares each definition with its copy at the merge base
          fetch-depth: 0

      # node and pnpm at the versions pinned in .mise/config.toml
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.18

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate definitions
        run: pnpm validate

      # The fixtures exercise every step whatever sites/ holds; only dry runs
      # read them, so they are never signed with the real key.
      - name: Validate the fixtures
        run: pnpm validate --sites test/fixtures/sites

      - name: Sign with a throwaway key
        run: |
          pnpm publish-events --dry-run
          pnpm publish-events --dry-run --sites test/fixtures/sites

      - name: Snapshot with a throwaway key
        run: |
          pnpm snapshot --dry-run
          pnpm snapshot --dry-run --sites test/fixtures/sites
